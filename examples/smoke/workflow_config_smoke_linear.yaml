qlib_init:
    provider_uri: ".tmp/qlib_smoke_data_ok"
    region: cn
    kernels: 1

market: &market all
benchmark: &benchmark SH000001

data_handler_config: &data_handler_config
    start_time: 2020-01-01
    end_time: 2020-01-08
    instruments: *market
    data_loader:
        class: QlibDataLoader
        module_path: qlib.data.dataset.loader
        kwargs:
            config:
                feature:
                    - ["$close", "Ref($close, 1)", "Mean($close, 2)"]
                    - ["close", "close_lag1", "close_mean2"]
                label:
                    - ["Ref($close, -1) / $close - 1"]
                    - ["LABEL0"]
    infer_processors:
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 1
            n_drop: 0
    backtest:
        start_time: 2020-01-07
        end_time: 2020-01-08
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0
            close_cost: 0.0
            min_cost: 0.0

task:
    model:
        class: LinearModel
        module_path: qlib.contrib.model.linear
        kwargs:
            estimator: ols
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.data.dataset
                kwargs: *data_handler_config
            segments:
                train: [2020-01-02, 2020-01-06]
                valid: [2020-01-07, 2020-01-07]
                test: [2020-01-07, 2020-01-08]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: True
              ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
